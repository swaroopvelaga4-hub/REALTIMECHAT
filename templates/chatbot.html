
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarvestAI - Farming Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f1f8f1;
            color: #222;
        }

        header {
            background: #176b35;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 25px auto;
            padding: 15px;
        }

        .chat-box {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 12px #00000015;
        }

        #messages {
            height: 350px;
            overflow-y: auto;
            padding: 10px;
            background: #f7faf7;
            border-radius: 10px;
        }

        .message {
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            max-width: 90%;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .bot {
            background: #e0f2e5;
            margin-right: auto;
        }

        .user {
            background: #176b35;
            color: white;
            margin-left: auto;
        }

        .input-area {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 16px;
            border: none;
            border-radius: 8px;
            background: #176b35;
            color: white;
            cursor: pointer;
        }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .suggestions button {
            background: #e0f2e5;
            color: #176b35;
        }

        .home {
            display: inline-block;
            margin-top: 15px;
            color: #176b35;
        }

        @media (max-width: 480px) {
            .input-area button {
                padding: 10px;
            }

            #messages {
                height: 320px;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>🌾 HarvestAI Chatbot</h1>
        <p>Your Farming Assistant | మీ వ్యవసాయ సహాయకుడు</p>
    </header>

    <div class="container">
        <div class="chat-box">

            <div id="messages" aria-live="polite">
                <div class="message bot">
                    నమస్కారం రైతు మిత్రమా! 🌱

                    Hello Farmer! Ask me about crops, pests,
                    fertilizers or farming.

                    పంటలు, తెగుళ్లు, ఎరువుల గురించి అడగండి.
                </div>
            </div>

            <div class="input-area">
                <input
                    type="text"
                    id="question"
                    placeholder="Ask your farming question..."
                    aria-label="Your farming question"
                >
                <button type="button" onclick="sendMessage()">Send</button>
            </div>

            <div class="suggestions">
                <button onclick="askQuestion('Rice farming')">🌾 Rice</button>
                <button onclick="askQuestion('Pest control')">🐛 Pest Control</button>
                <button onclick="askQuestion('Fertilizer')">🧪 Fertilizer</button>
                <button onclick="askQuestion('Weather')">🌦️ Weather</button>
            </div>

            <a class="home" href="/">← Back to Home</a>
        </div>
    </div>

    <script>
        const messages = document.getElementById("messages");
        const questionInput = document.getElementById("question");

        function addMessage(text, type) {
            const message = document.createElement("div");
            message.className = "message " + type;
            message.textContent = text;
            messages.appendChild(message);
            messages.scrollTop = messages.scrollHeight;
        }

        function askQuestion(question) {
            questionInput.value = question;
            sendMessage();
        }

        function sendMessage() {
            const question = questionInput.value.trim();

            if (!question) {
                questionInput.focus();
                return;
            }

            addMessage(question, "user");
            questionInput.value = "";

            const q = question.toLowerCase();
            let answer = "";

            if (
                q.includes("rice") ||
                q.includes("paddy") ||
                q.includes("వరి") ||
                q.includes("బియ్యం")
            ) {
                answer =
                    "🌾 Rice Farming / వరి సాగు\n\n" +
                    "Choose a suitable variety for your area and season. " +
                    "Use healthy seeds and follow local agricultural advice.\n\n" +
                    "మీ ప్రాంతం, సీజన్‌కు తగిన వరి రకాన్ని ఎంచుకోండి. " +
                    "నాణ్యమైన విత్తనాలు వాడి, స్థానిక వ్యవసాయ అధికారుల సలహా తీసుకోండి.";
            } else if (
                q.includes("pest") ||
                q.includes("insect") ||
                q.includes("తెగులు") ||
                q.includes("పురుగు")
            ) {
                answer =
                    "🐛 Pest Management / పురుగుల నివారణ\n\n" +
                    "Inspect the crop and identify the pest before choosing a treatment. " +
                    "Follow the label and local agricultural expert's advice.\n\n" +
                    "ముందుగా పురుగును సరిగ్గా గుర్తించండి. " +
                    "తర్వాతే తగిన నివారణ పద్ధతిని ఎంచుకోండి. " +
                    "మందుల విషయంలో వ్యవసాయ అధికారుల సలహా తీసుకోండి.";
            } else if (
                q.includes("fertilizer") ||
                q.includes("manure") ||
                q.includes("ఎరువు")
            ) {
                answer =
                    "🧪 Fertilizer Advice / ఎరువుల సలహా\n\n" +
                    "The correct fertilizer depends on crop, soil test results " +
                    "and crop growth stage. Avoid guessing the dose.\n\n" +
                    "ఏ ఎరువు, ఎంత మోతాదు అనేది పంట, నేల పరీక్ష ఫలితాలు, " +
                    "పంట దశపై ఆధారపడి ఉంటుంది. నేల పరీక్ష ఆధారంగా మోతాదు నిర్ణయించండి.";
            } else if (
                q.includes("weather") ||
                q.includes("వాతావరణం") ||
                q.includes("వర్షం")
            ) {
                answer =
                    "🌦️ Weather Advice / వాతావరణ సమాచారం\n\n" +
                    "Check the latest local forecast before irrigation, spraying " +
                    "or harvesting. I do not have live weather data in this chat yet.\n\n" +
                    "నీరు పెట్టే ముందు, మందులు పిచికారీ చేసే ముందు, " +
                    "కోతకు ముందు తాజా స్థానిక వాతావరణ సమాచారం తెలుసుకోండి.";
            } else if (
                q.includes("hello") ||
                q.includes("hi") ||
                q.includes("నమస్కారం")
            ) {
                answer =
                    "Hello Farmer! నమస్కారం! 🌱\n" +
                    "Ask me about rice, pests, fertilizers or weather.";
            } else if (
                q.includes("disease") ||
                q.includes("ఆకు") ||
                q.includes("వ్యాధి")
            ) {
                answer =
                    "🍃 Crop Disease / పంట వ్యాధులు\n\n" +
                    "Upload a clear crop or leaf photo in the Disease Doctor page " +
                    "for a preliminary analysis. Results may be incorrect, so " +
                    "confirm with a local agricultural expert before treatment.\n\n" +
                    "Disease Doctor పేజీలో స్పష్టమైన ఆకు ఫోటో ఇవ్వండి. " +
                    "చికిత్సకు ముందు నిపుణుడితో నిర్ధారించుకోండి.";
            } else {
                answer =
                    "I can answer basic questions about rice, pests, fertilizers, " +
                    "weather and crop diseases.\n\n" +
                    "నేను వరి, పురుగులు, ఎరువులు, వాతావరణం, పంట వ్యాధులపై " +
                    "ప్రాథమిక సమాచారం ఇవ్వగలను. దయచేసి మీ ప్రశ్నను కొంచెం వివరంగా అడగండి.";
            }

            addMessage(answer, "bot");
        }

        questionInput.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
