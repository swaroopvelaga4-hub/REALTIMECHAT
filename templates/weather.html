<!DOCTYPE html>
<html>
<head>
    <title>HarvestAI - Weather Forecast</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            text-align: center;
            padding: 30px;
        }

        .weather-box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #168aad;
        }

        .item {
            font-size: 18px;
            margin: 15px;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #168aad;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #0b6e8a;
        }

        .error {
            color: red;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="weather-box">

        <h1>🌦️ Weather Forecast</h1>

        <p>Check weather conditions and farming alerts.</p>

        <button onclick="getWeather()">
            📍 Check Weather
        </button>

        <div id="weatherResult">

            <div class="item">📍 Location: --</div>
            <div class="item">🌡️ Temperature: --</div>
            <div class="item">🌧️ Rainfall: --</div>
            <div class="item">💧 Humidity: --</div>
            <div class="item">💨 Wind: --</div>
            <div class="item">⚠️ Farming Alert: --</div>

        </div>

    </div>


    <script>

        function getWeather() {

            const result = document.getElementById("weatherResult");

            result.innerHTML = `
                <div class="item">📍 Getting your location...</div>
                <div class="item">🌡️ Temperature: Checking...</div>
                <div class="item">🌧️ Rainfall: Checking...</div>
                <div class="item">💧 Humidity: Checking...</div>
                <div class="item">💨 Wind: Checking...</div>
                <div class="item">⚠️ Farming Alert: Checking...</div>
            `;


            if (!navigator.geolocation) {

                result.innerHTML = `
                    <div class="error">
                        ❌ Location is not supported by this browser.
                    </div>
                `;

                return;
            }


            navigator.geolocation.getCurrentPosition(

                async function(position) {

                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;


                    try {

                        /*
                         * Get City + State
                         * using device latitude and longitude
                         */

                        const locationResponse = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}&zoom=10&addressdetails=1`,
                            {
                                headers: {
                                    "Accept": "application/json"
                                }
                            }
                        );


                        const locationData =
                            await locationResponse.json();


                        const address =
                            locationData.address || {};


                        const city =
                            address.city ||
                            address.town ||
                            address.village ||
                            address.municipality ||
                            "Unknown";


                        const state =
                            address.state || "";


                        const locationName =
                            state
                            ? `${city}, ${state}`
                            : city;


                        result.innerHTML = `

                            <div class="item">
                                📍 Location: ${locationName}
                            </div>

                            <div class="item">
                                🌡️ Temperature: Checking...
                            </div>

                            <div class="item">
                                🌧️ Rainfall: Checking...
                            </div>

                            <div class="item">
                                💧 Humidity: Checking...
                            </div>

                            <div class="item">
                                💨 Wind: Checking...
                            </div>

                            <div class="item">
                                ⚠️ Farming Alert: Checking...
                            </div>

                        `;


                        /*
                         * Temporary weather values
                         * Real weather will be connected next.
                         */

                        setTimeout(function() {

                            result.innerHTML = `

                                <div class="item">
                                    📍 Location: ${locationName}
                                </div>

                                <div class="item">
                                    🌡️ Temperature: 30°C
                                </div>

                                <div class="item">
                                    🌧️ Rainfall: Low
                                </div>

                                <div class="item">
                                    💧 Humidity: 65%
                                </div>

                                <div class="item">
                                    💨 Wind: 12 km/h
                                </div>

                                <div class="item">
                                    ⚠️ Farming Alert: No major alert
                                </div>

                            `;

                        }, 1000);


                    } catch (error) {

                        console.log("Location Error:", error);

                        result.innerHTML = `

                            <div class="error">
                                ❌ Unable to find your city name.
                            </div>

                            <div class="item">
                                Please try again.
                            </div>

                        `;

                    }

                },


                function(error) {

                    result.innerHTML = `

                        <div class="error">
                            ❌ Unable to get your location.
                        </div>

                        <div class="item">
                            Please allow location permission
                            and try again.
                        </div>

                    `;

                }

            );

        }

    </script>

</body>
</html>
