```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarvestAI - Weather Forecast</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f0f8ff;
            text-align: center;
            padding: 20px;
        }

        .weather-box {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 { color: #168aad; }

        .item {
            font-size: 18px;
            margin: 15px 0;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #168aad;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .error { color: red; }
    </style>
</head>

<body>
<div class="weather-box">
    <h1>🌦️ Weather Forecast</h1>
    <p>Check weather conditions and farming alerts.</p>

    <button id="weatherButton" onclick="getWeather()">
        📍 Check Weather
    </button>

    <div id="weatherResult">
        <div class="item">📍 Location: --</div>
        <div class="item">🌡️ Temperature: --</div>
        <div class="item">🌧️ Rainfall: --</div>
        <div class="item">💧 Humidity: --</div>
        <div class="item">💨 Wind: --</div>
        <div class="item">⚠️ Farming Alert: --</div>
    </div>
</div>

<script>
async function getWeather() {
    const result = document.getElementById("weatherResult");
    const button = document.getElementById("weatherButton");

    if (!navigator.geolocation) {
        result.innerHTML = '<p class="error">Location is not supported by this browser.</p>';
        return;
    }

    button.disabled = true;
    result.innerHTML = '<p>📍 Getting your location...</p>';

    navigator.geolocation.getCurrentPosition(
        async function(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            try {
                result.innerHTML = '<p>🌦️ Loading weather information...</p>';

                let city = "Your location";
                let state = "";

                try {
                    const locResponse = await fetch(
                        `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&addressdetails=1`
                    );

                    if (locResponse.ok) {
                        const locData = await locResponse.json();
                        const address = locData.address || {};

                        city = address.city ||
                               address.town ||
                               address.village ||
                               address.municipality ||
                               address.county ||
                               address.suburb ||
                               "Your location";

                        state = address.state || "";
                    }
                } catch (e) {
                    console.log("City lookup failed:", e);
                }

                // Fetch actual current weather; no API key required.
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,precipitation,rain,wind_speed_10m&timezone=auto`
                );

                if (!response.ok) {
                    throw new Error("Weather service unavailable");
                }

                const data = await response.json();
                const weather = data.current;

                if (!weather) {
                    throw new Error("Weather data missing");
                }

                const temperature = weather.temperature_2m;
                const humidity = weather.relative_humidity_2m;
                const rainfall = weather.precipitation;
                const wind = weather.wind_speed_10m;

                let alert = "No major rainfall alert";
                if (rainfall >= 10) {
                    alert = "Rain detected: check drainage and protect crops";
                } else if (temperature >= 38) {
                    alert = "High temperature: check crop water needs";
                } else if (wind >= 30) {
                    alert = "Strong wind: check crop and support structures";
                }

                const locationName = state ? `${city}, ${state}` : city;

                result.innerHTML = `
                    <div class="item">📍 Location: ${locationName}</div>
                    <div class="item">🌡️ Temperature: ${temperature} °C</div>
                    <div class="item">🌧️ Rainfall: ${rainfall} mm</div>
                    <div class="item">💧 Humidity: ${humidity}%</div>
                    <div class="item">💨 Wind: ${wind} km/h</div>
                    <div class="item">⚠️ Farming Alert: ${alert}</div>
                    <p><small>Weather data: Open-Meteo</small></p>
                `;

            } catch (error) {
                console.error("Weather error:", error);
                result.innerHTML = `
                    <p class="error">
                        Unable to load weather data. Please check your internet connection and try again.
                    </p>
                `;
            } finally {
                button.disabled = false;
            }
        },

        function(error) {
            let message = "Unable to get your location.";

            if (error.code === 1) {
                message = "Location permission denied. Allow location access in your browser settings.";
            } else if (error.code === 2) {
                message = "Your location is unavailable. Please try again.";
            } else if (error.code === 3) {
                message = "Location request timed out. Please try again.";
            }

            result.innerHTML = `<p class="error">📍 ${message}</p>`;
            button.disabled = false;
        },

        { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
    );
}
</script>
</body>
</html>
