<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HarvestAI - Crop Disease Detection</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f8e9;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 {
            color: #2e7d32;
        }

        p {
            color: #555;
        }

        input[type="file"] {
            margin: 25px 0;
            padding: 10px;
            width: 90%;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1b5e20;
        }

        .info {
            margin-top: 25px;
            padding: 15px;
            background: #e8f5e9;
            border-radius: 10px;
            text-align: left;
        }

        img {
            margin-top: 15px;
            border-radius: 10px;
            max-width: 100%;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌱 HarvestAI</h1>

    <h2>🔍 Crop Disease Detection</h2>

    <p>Upload a crop or leaf photo to analyze.</p>

    <form action="/predict" method="POST" enctype="multipart/form-data">

        <input type="file" name="image" accept="image/*" required>

        <br>

        <button type="submit">
            🔍 Analyze Crop
        </button>

    </form>

    <div class="info">

        <h3>🌿 AI Detection Result</h3>

        {% if result %}
            <p><strong>{{ result }}</strong></p>
        {% else %}
            <p>Crop Name: Waiting for image...</p>
            <p>Disease: Waiting for analysis...</p>
            <p>Treatment: Waiting for analysis...</p>
        {% endif %}

        {% if image_url %}
            <img src="{{ image_url }}" alt="Uploaded Crop">
        {% endif %}

    </div>

</div>

</body>
</html>
